<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to SRA - Siddhivinayak Realtors and Associates">
    <title>Login - SRA</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/glassmorphism.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #14b8a6 100%);
            position: relative;
            overflow: hidden;
        }

        .auth-page::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -250px;
            right: -250px;
        }

        .auth-page::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            bottom: -200px;
            left: -200px;
        }

        .auth-container {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>

    <div class="auth-page">
        <div class="container auth-container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-7">
                    <div class="glass-container text-center">
                        <!-- Logo/Brand -->
                        <div class="mb-4">
                            <i class="bi bi-building display-3 text-primary-blue"></i>
                            <h2 class="mt-3 mb-2">Welcome Back</h2>
                            <p class="text-muted">Login to Siddhivinayak Realtors and Associates</p>
                        </div>

                        <!-- Alert Message -->
                        <div id="alertMessage" class="alert d-none" role="alert"></div>

                        <!-- Login Form -->
                        <form id="loginForm" class="text-start">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="Enter your email"
                                        required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">Mobile Number <span
                                        class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-telephone"></i> +91</span>
                                    <input type="tel" class="form-control" id="phone"
                                        placeholder="10-digit mobile number" pattern="[6-9][0-9]{9}" maxlength="10"
                                        required>
                                </div>
                                <small class="text-muted">Enter 10-digit Indian mobile number</small>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password"
                                        placeholder="Enter your password" required>
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                                        <i class="bi bi-eye" id="toggleIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Remember me</label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3">
                                <i class="bi bi-box-arrow-in-right"></i> Login
                            </button>

                            <div class="text-center">
                                <p class="text-muted mb-2">Don't have an account? <a href="register.html"
                                        class="text-primary-blue fw-bold">Register here</a></p>
                                <a href="index.html" class="text-muted"><i class="bi bi-arrow-left"></i> Back to
                                    Home</a>
                            </div>
                        </form>

                        <!-- Demo Credentials Info -->
                        <div class="mt-4 p-3 bg-light rounded">
                            <small class="text-muted">
                                <strong>Demo Admin Credentials:</strong><br>
                                Email: admin@sra.com<br>
                                Password: admin123
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/auth.js"></script>

    <script>
        // Check if already logged in
        if (auth.isLoggedIn()) {
            if (auth.isAdmin()) {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'index.html';
            }
        }

        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('bi-eye');
                toggleIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('bi-eye-slash');
                toggleIcon.classList.add('bi-eye');
            }
        }

        // Show alert message
        function showAlert(message, type = 'danger') {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.classList.remove('d-none');

            setTimeout(() => {
                alertDiv.classList.add('d-none');
            }, 5000);
        }

        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;

            // Validate Indian phone number
            if (!/^[6-9][0-9]{9}$/.test(phone)) {
                showAlert('Please enter a valid 10-digit Indian mobile number (starting with 6-9).', 'danger');
                return;
            }

            const result = auth.login(email, password);

            if (result.success) {
                showAlert('Login successful! Redirecting...', 'success');

                setTimeout(() => {
                    if (result.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 1000);
            } else {
                showAlert(result.message, 'danger');
            }
        });
    </script>
</body>

</html>
